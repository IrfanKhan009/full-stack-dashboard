services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8081:8080"
    environment:
      # No defaults on purpose: set these in .env (see .env.example).
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Bootstrap__UserEmail: ${DEMO_USER_EMAIL:?set DEMO_USER_EMAIL in .env}
      Bootstrap__UserPassword: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
      Seed__Orders: "1500"          # synthetic demo orders; set to 0 to disable
    volumes:
      - dashboard-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    environment:
      Api__BaseUrl: http://api:8080
    depends_on:
      - api
volumes:
  dashboard-data:
